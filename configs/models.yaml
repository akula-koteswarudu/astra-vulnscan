# Model definitions. Adding a model = adding an entry here; adding a provider = one adapter + one registry line.
# Rate limits: Groq values read from the Groq console / response headers on 14 Nov 2026 (free tier);
# Anthropic values read from the rate-limit response headers at setup (step 6).
models:
  teacher:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_tokens: 1000000          # true window
    planning_budget_tokens: 150000   # what we choose to send per request (cost control)
    max_output_tokens: 32000         # covers adaptive thinking + JSON output; streamed
    temperature: null                # null = omit (Sonnet 5.5 rejects non-default sampling)
    params:                          # passthrough, provider-specific
      output_config: {effort: high}
      fallbacks: default             # server-side refusal fallback (beta server-side-fallback-2026-07-01)
    price_per_mtok: {input: 2.0, output: 10.0}
    rate_limit: {rpm: 13000, itpm: 10000000, otpm: 2000000}   # from anthropic-ratelimit-* headers, 14 Nov 2026
    max_tokens_param: max_tokens
    concurrency: 2
    sdk_max_retries: 0               # our RetryingClient owns retries
    retry: {max_attempts: 4, base_delay_s: 2}
  student:
    provider: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    context_tokens: 131072
    planning_budget_tokens: 4900     # what we choose to send per request: keeps units small enough for the 1,000-token answer cap
    max_output_tokens: 1000          # Groq free tier caps this model at 1,000 output tokens per minute (max_tokens above it is rejected)
    temperature: 0
    json_mode: instruction           # instruction | json_object
    params: {}
    price_per_mtok: {input: 0, output: 0}   # free tier; tokens reported, cost shown as $0
    rate_limit: {rpm: 30, tpm: 8000, itpm: 7000, otpm: 1000, rpd: 1000}   # tpm/rpd from x-ratelimit headers; itpm 7000 and otpm 1000 from 429 bodies and a max_tokens probe (14 Nov 2026); rpm: free-tier default
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
  judge_open:                        # free open-model judge; slow on the free tier (8K tokens/minute)
    provider: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b       # different family from the student; never the teacher
    api_key_env: GROQ_API_KEY
    context_tokens: 131072
    max_output_tokens: 3000          # reasoning model: leaves room for reasoning + the JSON answer
    temperature: 0
    json_mode: instruction
    params: {reasoning_effort: low}
    price_per_mtok: {input: 0, output: 0}
    rate_limit: {rpm: 30, tpm: 8000, itpm: 7000, rpd: 1000}   # tpm 8000 and rpd 1000 from x-ratelimit headers; itpm 7000 from a 429 body (14 Nov 2026); rpm: free-tier default
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
  judge_haiku:                       # current judge (chosen for speed): a Claude model, but not the teacher
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_tokens: 1000000
    max_output_tokens: 2000          # adaptive thinking at low effort + a short JSON verdict
    temperature: null                # Haiku 5.5 rejects non-default sampling
    params:
      output_config: {effort: low}   # no `fallbacks`: Haiku 5.5 has no server-side fallback
    price_per_mtok: {input: 0.10, output: 0.50}   # prompts up to 100K tokens
    rate_limit: {rpm: 13000, itpm: 10000000, otpm: 2000000}   # from anthropic-ratelimit-* headers, 14 Nov 2026
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 2}
  student_pollinations:              # current student: same open model as `student`, served by Pollinations (no tight per-minute cap)
    provider: openai_compatible
    base_url: https://gen.pollinations.ai/v1
    model: qwen/qwen3.8-27b
    api_key_env: POLLINATIONS_API_KEY
    context_tokens: 262144
    planning_budget_tokens: 120000   # whole first-party app (~20K Qwen tokens here) in one request
    max_output_tokens: 8000          # whole-app answer measured at ~2.8K tokens
    temperature: 0
    json_mode: instruction
    params: {reasoning_effort: none, seed: 42}   # reasoning off (with it on, it spent 8K tokens thinking and never answered); matches its Groq behaviour
    price_per_mtok: {input: 0, output: 0}        # billed in Pollen (0.041 / 1.319 Pollen per M tokens); shown as $0
    rate_limit: {rpm: 60, itpm: 1000000}         # not published for keyed access; conservative client-side pacing, 429s are retried
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
  judge_pollinations:                # current judge: open-weight, different family from the student, never the teacher
    provider: openai_compatible
    base_url: https://gen.pollinations.ai/v1
    model: deepseek/deepseek-v4.1-flash
    api_key_env: POLLINATIONS_API_KEY
    context_tokens: 1048576
    max_output_tokens: 3000
    temperature: 0
    json_mode: instruction
    params: {reasoning_effort: low, seed: 42}
    price_per_mtok: {input: 0, output: 0}        # billed in Pollen (0.15 / 0.6 Pollen per M tokens)
    rate_limit: {rpm: 60, itpm: 1000000}
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
roles: {teacher: teacher, student: student_pollinations, judge: judge_pollinations}   # earlier runs: student (Groq), judge_haiku / judge_open

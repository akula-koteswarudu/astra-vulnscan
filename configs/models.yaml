# Model definitions. Adding a model = adding an entry here; adding a provider = one adapter + one registry line.
# Rate limits: Groq values read from the Groq console / response headers on 14 Nov 2026 (free tier);
# Anthropic values read from the rate-limit response headers at setup (step 6).
models:
  teacher:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_tokens: 1000000          # true window
    planning_budget_tokens: 150000   # what we choose to send per request (cost control)
    max_output_tokens: 32000         # covers adaptive thinking + JSON output; streamed
    temperature: null                # null = omit (Sonnet 5.5 rejects non-default sampling)
    params:                          # passthrough, provider-specific
      output_config: {effort: high}
      fallbacks: default             # server-side refusal fallback (beta server-side-fallback-2026-07-01)
    price_per_mtok: {input: 2.0, output: 10.0}
    rate_limit: {rpm: 13000, itpm: 10000000, otpm: 2000000}   # from anthropic-ratelimit-* headers, 14 Nov 2026
    max_tokens_param: max_tokens
    concurrency: 2
    sdk_max_retries: 0               # our RetryingClient owns retries
    retry: {max_attempts: 4, base_delay_s: 2}
  student:
    provider: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    context_tokens: 131072
    planning_budget_tokens: 4900     # what we choose to send per request: keeps units small enough for the 1,000-token answer cap
    max_output_tokens: 1000          # Groq free tier caps this model at 1,000 output tokens per minute (max_tokens above it is rejected)
    temperature: 0
    json_mode: instruction           # instruction | json_object
    params: {}
    price_per_mtok: {input: 0, output: 0}   # free tier; tokens reported, cost shown as $0
    rate_limit: {rpm: 30, tpm: 8000, itpm: 7000, otpm: 1000, rpd: 1000}   # tpm/rpd from x-ratelimit headers; itpm 7000 and otpm 1000 from 429 bodies and a max_tokens probe (14 Nov 2026); rpm: free-tier default
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
  judge:
    provider: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b       # different family from the student; never the teacher
    api_key_env: GROQ_API_KEY
    context_tokens: 131072
    max_output_tokens: 3000          # reasoning model: leaves room for reasoning + the JSON answer
    temperature: 0
    json_mode: instruction
    params: {reasoning_effort: low}
    price_per_mtok: {input: 0, output: 0}
    rate_limit: {rpm: 30, tpm: 8000, itpm: 7000, rpd: 1000}   # tpm 8000 and rpd 1000 from x-ratelimit headers; itpm 7000 from a 429 body (14 Nov 2026); rpm: free-tier default
    max_tokens_param: max_tokens
    concurrency: 1
    sdk_max_retries: 0
    retry: {max_attempts: 4, base_delay_s: 5}
roles: {teacher: teacher, student: student, judge: judge}
